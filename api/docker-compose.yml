services:
  zine-api:
    build:
      dockerfile: Dockerfile
    container_name: zine-api
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json  
    restart: unless-stopped

  db:
    image: postgres:latest
    container_name: zine-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
