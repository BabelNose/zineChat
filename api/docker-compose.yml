version: '3'
services:
  node:
    image: zine_chat
    ports:
      - 3000:3000
  mongo:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASS}
      - MONGO_INITDB_DATABASE=${MONGODB_DB_NAME}
    volumes:
      - ./data:/data/db
    ports:
      - "27017:27017"