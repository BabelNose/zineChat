# Launches the whole stack (Postgres + API, Meilisearch + Ventstream, frontend) with a
# single `docker compose up` from the repo root. Each stack is pulled in as-is from its
# own directory's compose file, so it still reads its own .env and can also be started
# on its own from there.
name: zinechat

include:
  - api/docker-compose.yml
  - path:
      - search/docker-compose.yml
      - search/docker-compose.root.yml
  - path:
      - frontend/docker-compose.yml
      - frontend/docker-compose.root.yml
