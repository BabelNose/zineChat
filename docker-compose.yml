# Launches the whole stack (Postgres + API, Meilisearch + Ventstream, frontend) with a
# single `docker compose up` from the repo root. The api and search stacks are pulled in
# as-is from their own compose files, so each still reads its own .env and can also be
# started on its own from its directory.
name: zinechat

include:
  - api/docker-compose.yml
  - path:
      - search/docker-compose.yml
      - search/docker-compose.root.yml

services:
  zine-frontend:
    build:
      context: frontend
    container_name: zine-frontend
    depends_on:
      - zine-api
    environment:
      # Server-side load functions call the API from inside the container, so reach it
      # by service name rather than localhost.
      - API_URL=http://zine-api:4000
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/static
          target: /app/static
        - action: rebuild
          path: ./frontend/package.json
    restart: unless-stopped
