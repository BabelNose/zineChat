services:
  zine-frontend:
    build:
      dockerfile: Dockerfile
    container_name: zine-frontend
    environment:
      # Server-side load functions call the API from inside the container, so localhost
      # won't reach it. On its own, this stack isn't on the API's network, so go through
      # the host where the API's port is published. docker-compose.root.yml switches this
      # to the service name when launched from the repo root.
      - API_URL=http://host.docker.internal:4000
    ports:
      - "5173:5173"
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./static
          target: /app/static
        - action: rebuild
          path: package.json
    restart: unless-stopped
